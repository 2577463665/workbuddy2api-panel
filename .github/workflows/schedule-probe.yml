name: schedule-probe

# 临时探针：验证本 fork 的 schedule 触发器是否可用（验证完即删）
# 背景：sync-upstream 的每小时 cron 从未触发（3 个时点全部无记录），
# 需确认是 GitHub 对 fork 的限制，还是调度延迟。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 记录触发方式与时间
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          date -u '+utc=%Y-%m-%d %H:%M:%S'
