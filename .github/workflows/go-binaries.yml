name: go-binaries

# 可运行二进制构建/发布：
#   - PR / push main → 测试 + 五平台编译验证 + KSU arm64-v8a 模块打包（产物仅存 artifact，不发布）
#   - push v* tag    → 同上 + 打包上传到 GitHub Release（zip/tar.gz + KSU 模块 zip + checksums）
#   - workflow_call  → 供 sync-upstream.yml / release.yml 复用（tag 由调用方推好，
#                      以 inputs.tag 为 ref 检出构建，避免 push 事件的递归防护限制）
#
# 发布纪律（本 fork 独立版本体系，0.0.1 起步）：
#   1. 版本号唯一来源 = 仓库根目录 FORK_VERSION（刻意不写进 cmd/server/main.go 的
#      appVersion —— 那是上游文件，改了它上游每次发版都会让自动合并冲突）
#   2. 构建时用 -ldflags "-X main.forkVersion=<版本>" 注入二进制，并断言二进制含该串
#   3. tag 版本必须等于 FORK_VERSION（-ci 后缀的演练 tag 豁免）
#   4. 二进制一律 -s -w 剥离符号
#
# KSU 模块说明：KernelSU/Magisk 通用模块，运行于 android arm64-v8a 设备。
# 触发方式沿用 tag push（而非 on: release）——Release 由 GITHUB_TOKEN 创建，
# 其事件不会触发其他工作流（GitHub 递归触发防护），监听 release 事件永远不跑。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "config.example.json"
      - "ksu/**"
      - "FORK_VERSION"
      - ".github/workflows/go-binaries.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "要构建发布的 tag（如 v1.12.1）；不传则用触发 ref"
        type: string
        required: false
        default: ""
    # 注意：GITHUB_TOKEN 是保留的自动 secret，不能在 workflow_call 里显式声明
    # （声明会导致整个 workflow 校验失败）。子工作流通过 permissions 获得所需权限。

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_call 场景（sync-upstream 自动发版）需检出调用方指定的 tag
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # ubuntu runner 自带 node → panel 包的 JS 运行时冒烟测试（TestAppJSTopLevelSmoke）会真实执行
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .zip }
          - { goos: linux, goarch: amd64, ext: .tar.gz }
          - { goos: linux, goarch: arm64, ext: .tar.gz }
          - { goos: darwin, goarch: amd64, ext: .tar.gz }
          - { goos: darwin, goarch: arm64, ext: .tar.gz }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 本 fork 的发布版本号唯一来源是仓库根目录的 FORK_VERSION。
      # 刻意不放在 cmd/server/main.go 的 appVersion：那是上游代码，本 fork 改了它，
      # 上游每次发版（改同一行）都会让 sync-upstream 的自动合并冲突。
      - name: 取本 fork 版本号
        id: ver
        run: echo "v=$(tr -d ' \r\n' < FORK_VERSION)" >> "$GITHUB_OUTPUT"

      - name: 构建（剥离符号 + 注入 fork 版本号）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w -X main.forkVersion=${{ steps.ver.outputs.v }}" -o "wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/server

      # 版本串断言：二进制必须含注入的 fork 版本号（防交叉编译矩阵里编错树/漏 ldflags）
      - name: 断言二进制版本串
        run: |
          BIN="wb2api${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if ! grep -qa "${{ steps.ver.outputs.v }}" "$BIN"; then
            echo "::error::binary missing fork version string ${{ steps.ver.outputs.v }}"
            exit 1
          fi
          echo "version assert OK: ${{ steps.ver.outputs.v }}"

      - name: 打包（windows=zip 三件套，其余=tar.gz）
        run: |
          V="${{ steps.ver.outputs.v }}"
          case "${{ matrix.goos }}" in
            windows)
              NAME="wb2api-panel-v${V}-windows-amd64.zip"
              zip -q "$NAME" wb2api.exe config.example.json README.md
              ;;
            *)
              NAME="wb2api-panel-v${V}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
              tar czf "$NAME" wb2api config.example.json README.md
              ;;
          esac
          echo "name=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # KernelSU/Magisk 模块（android arm64-v8a）：复用 build 矩阵产出的 linux-arm64 二进制
  # （CGO_ENABLED=0 纯静态，同一 ELF 在 Android 用户态直接可跑），组装模块结构后打包。
  # 模块脚本在 ksu/ 目录维护；module.prop 版本号在 CI 注入，保持与 Release 一致。
  ksu-module:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 取本 fork 版本号
        id: ver
        run: |
          V="$(tr -d ' \r\n' < FORK_VERSION)"
          echo "v=$V" >> "$GITHUB_OUTPUT"    # fork 版本号（0.0.1），版本串断言 / module.prop 用
          echo "vf=$V" >> "$GITHUB_OUTPUT"   # 资产文件名口径（与 v 同值，保留以防命名规则变化）

      # 拿 build 矩阵的 linux-arm64 产物（wb2api-panel-vX.Y.Z-linux-arm64.tar.gz）
      - uses: actions/download-artifact@v4
        with:
          name: wb2api-panel-v${{ steps.ver.outputs.vf }}-linux-arm64.tar.gz

      - name: 组装模块结构
        run: |
          set -eu
          V="${{ steps.ver.outputs.v }}"
          VF="${{ steps.ver.outputs.vf }}"
          TARBALL="wb2api-panel-v${VF}-linux-arm64.tar.gz"

          # 解出 linux-arm64 二进制并断言 fork 版本串（防编错树/漏 ldflags）
          tar xzf "$TARBALL" wb2api
          if ! grep -qa "$V" wb2api; then
            echo "::error::ksu binary missing fork version string $V"
            exit 1
          fi

          STAGE="$(mktemp -d)/module"
          mkdir -p "$STAGE"

          # 模块骨架：脚本与 meta 来自仓库 ksu/ 目录（README.md/.gitattributes 是维护者文件，不进模块）
          cp -r ksu/. "$STAGE/"
          rm -f "$STAGE/README.md" "$STAGE/.gitattributes"

          # 二进制置入模块
          install -m 0755 wb2api "$STAGE/wb2api"

          # module.prop 注入真实版本：version 与 Release 同号；versionCode 用
          # 1.2.3 → 10203 的十进制拼装（KSU/Magisk 只要求单调递增即可）
          A="${VF%%.*}"; R="${VF#*.}"; B="${R%%.*}"; C="${R#*.}"
          VCODE="$((A * 1000000 + B * 1000 + C))"
          sed -i "s/^version=.*/version=v${VF}/; s/^versionCode=.*/versionCode=${VCODE}/" "$STAGE/module.prop"

          # 行尾统一为 LF（module.prop 必须 LF：KSU/Magisk 官方格式要求）并统一可执行位。
          # ksu/.gitattributes 已锁定 eol=lf，这里是第二道兜底（防上游以 CRLF 提交）。
          # webroot/ 的权限与 SELinux 上下文由 KernelSU 安装时自动设置——官方文档明确要求
          # 模块不要自行设置，故此处不碰该目录。
          sed -i 's/\r$//' "$STAGE/module.prop" \
                           "$STAGE"/service.sh "$STAGE"/start.sh "$STAGE"/action.sh \
                           "$STAGE"/uninstall.sh "$STAGE"/info.sh "$STAGE"/cacert.sh \
                           "$STAGE"/customize.sh \
                           "$STAGE"/webroot/index.html
          chmod 0755 "$STAGE"/service.sh "$STAGE"/start.sh "$STAGE"/action.sh \
                     "$STAGE"/uninstall.sh "$STAGE"/info.sh "$STAGE"/cacert.sh \
                     "$STAGE"/customize.sh

          # 打包：模块 zip 必须在根目录直接含 module.prop（不能套顶层文件夹）
          NAME="wb2api-panel-v${VF}-ksu-arm64-v8a.zip"
          ( cd "$STAGE" && zip -qr9 "$GITHUB_WORKSPACE/$NAME" . )
          echo "name=$NAME" >> "$GITHUB_ENV"

          # 落一份结构清单进日志，方便发布时人工核对
          unzip -l "$GITHUB_WORKSPACE/$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}
          retention-days: 7

  # tag 触发的发布；workflow_call（sync-upstream 自动跟上游）由调用方传入 inputs.tag
  publish:
    needs: [build, ksu-module]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0   # 取历史 tag 算 compare 链接

      # 统一发布 tag 口径：tag push 用 ref 名，workflow_call 用 inputs.tag
      - name: 解析发布 tag
        id: rel
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # 发布纪律：tag 版本必须等于 FORK_VERSION（-ci 演练 tag 豁免）。
      # 防止「打了 tag 却忘了升版本号」——那样会产出版本号错乱的 Release，
      # 且模块的 versionCode 不再增长、用户收不到更新提示。
      - name: tag 与 FORK_VERSION 一致性断言
        run: |
          SRC="$(tr -d ' \r\n' < FORK_VERSION)"
          TAG_NAME="${{ steps.rel.outputs.tag }}"
          TAG="${TAG_NAME#v}"
          if [[ "$TAG_NAME" != *-ci ]]; then
            if [[ "$TAG" != "$SRC" ]]; then
              echo "::error::tag $TAG_NAME 与 FORK_VERSION=$SRC 不一致（先升版本号再打 tag）"
              exit 1
            fi
            echo "版本一致性 OK: tag=$TAG_NAME FORK_VERSION=$SRC"
          else
            echo "演练 tag（-ci 后缀）跳过一致性断言：tag=$TAG src=$SRC"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 模块在线更新清单。作为 Release 资产发布，module.prop 的 updateJson 指向
      # https://github.com/<owner>/<repo>/releases/latest/download/update.json
      # —— GitHub 的 latest 稳定地址：即时生效、无长时间 CDN 缓存，且与模块 zip 同源
      # （能下 zip 就能取 json，不引入额外可达性风险）。prerelease（-ci 演练 tag）不会
      # 成为 latest，因此天然不会污染更新频道。
      - name: 生成模块更新清单
        run: |
          set -eu
          TAG_NAME="${{ steps.rel.outputs.tag }}"
          V="${TAG_NAME#v}"
          A="${V%%.*}"; R="${V#*.}"; B="${R%%.*}"; C="${R#*.}"
          VCODE="$((A * 1000000 + B * 1000 + C))"   # 与 ksu-module job 同口径
          REPO="${GITHUB_REPOSITORY}"
          {
            echo '{'
            echo "  \"version\": \"v${V}\","
            echo "  \"versionCode\": ${VCODE},"
            echo "  \"zipUrl\": \"https://github.com/${REPO}/releases/download/${TAG_NAME}/wb2api-panel-v${V}-ksu-arm64-v8a.zip\","
            echo "  \"changelog\": \"https://github.com/${REPO}/releases/tag/${TAG_NAME}\""
            echo '}'
          } > dist/update.json
          cat dist/update.json

      - name: checksums
        run: cd dist && sha256sum *.zip *.tar.gz > checksums.txt && ls -la
      - name: 上一版 tag（compare 链接用）
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ steps.rel.outputs.tag }}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          prerelease: ${{ contains(steps.rel.outputs.tag, '-') }}
          body: |
            wb2api-panel **${{ steps.rel.outputs.tag }}**（本 fork 独立版本号）

            - 五平台二进制（Windows / Linux / macOS × amd64 / arm64）
            - KernelSU / Magisk 模块：`wb2api-panel-${{ steps.rel.outputs.tag }}-ksu-arm64-v8a.zip`
            - checksums.txt 校验和

            上游面板代码版本见二进制启动日志（`workbuddy2api-panel fork <本版本> (upstream panel <上游版本>)`）。

            完整变更：https://github.com/${{ github.repository }}/compare/${{ steps.prev.outputs.prev }}...${{ steps.rel.outputs.tag }}
          files: dist/*

      # ── 备用更新频道（jsdelivr 镜像）─────────────────────────────────────────
      # 主通道是 Release 资产（见 module.prop 的 updateJson）：
      #   https://github.com/<owner>/<repo>/releases/latest/download/update.json
      # 即时生效、无长时间缓存，且与模块 zip 同源。
      # 这里额外同步一份到 ksu-update 分支，作为备用地址：
      #   https://cdn.jsdelivr.net/gh/<owner>/<repo>@ksu-update/update.json
      # 实测 jsdelivr 对分支引用的缓存很顽固（purge 返回成功后仍可能返回旧内容），
      # 故只作备用，不作为模块默认更新源。
      # -ci 演练 tag 跳过：演练版本不得进更新频道。
      - name: 同步 update.json 到 ksu-update 分支（备用镜像）
        if: ${{ !contains(steps.rel.outputs.tag, '-ci') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG_NAME="${{ steps.rel.outputs.tag }}"
          REPO="${GITHUB_REPOSITORY}"
          # 复用上一步生成的清单，避免两处各自拼 JSON 造成口径漂移
          cp dist/update.json update.json
          cat update.json

          # 用 Contents API 写文件（GITHUB_TOKEN 足够；推分支不触发 on: push 工作流，
          # 无递归触发风险）。分支不存在时先从当前 commit 建。
          REF_SHA=$(curl -sf -H "Authorization: token ${GH_TOKEN}" \
                "https://api.github.com/repos/${REPO}/git/ref/heads/ksu-update" \
              | jq -r '.object.sha' || true)
          if [ -z "${REF_SHA}" ] || [ "${REF_SHA}" = "null" ]; then
            curl -sf -X POST -H "Authorization: token ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${REPO}/git/refs" \
                 -d "{\"ref\": \"refs/heads/ksu-update\", \"sha\": \"${GITHUB_SHA}\"}"
          fi

          # 已存在则取当前 blob sha（PUT 更新 contents 必须带）
          FILE_SHA=$(curl -sf -H "Authorization: token ${GH_TOKEN}" \
                "https://api.github.com/repos/${REPO}/contents/update.json?ref=ksu-update" \
              | jq -r '.sha' || true)
          B64=$(base64 -w0 < update.json)
          BODY="{\"message\": \"ksu update channel: ${TAG_NAME}\", \"content\": \"${B64}\", \"branch\": \"ksu-update\"}"
          if [ -n "${FILE_SHA}" ] && [ "${FILE_SHA}" != "null" ]; then
            BODY=$(echo "$BODY" | jq --arg s "$FILE_SHA" '. + {sha: $s}')
          fi
          curl -sf -X PUT -H "Authorization: token ${GH_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${REPO}/contents/update.json?ref=ksu-update" \
               -d "$BODY"
          echo "update.json pushed to ksu-update branch"

          # 清 jsdelivr CDN 缓存：否则最长 12h 内手机管理器仍拉到旧版本（更新提示延迟半天）。
          # purge 失败不算发布失败——缓存稍后会自然过期，仅告警。
          if curl -sf --max-time 60 "https://purge.jsdelivr.net/gh/${REPO}@ksu-update/update.json" >/dev/null; then
            echo "jsdelivr 缓存已刷新（更新提示立即可见）"
          else
            echo "::warning::jsdelivr purge 失败，更新提示可能延迟到缓存过期（最长 12h）"
          fi
