name: sync-upstream

# 自动跟随上游面板更新（无需人工干预）：
#   定时检查 upstream（linguo2625469/workbuddy2api-panel）→ 有新提交则：
#     1. 合并进本仓库 main（上游代码零改动，因此不会冲突——见下）
#     2. 递增本 fork 自己的版本号（0.0.1 → 0.0.2，patch +1）
#     3. 推送 main + 打 tag
#     4. 同 run 内调用 go-binaries 完成构建与发布
#
# 版本号为什么独立、且放在 FORK_VERSION 而不是 main.go：
#   本 fork 的版本号与上游版本号完全解耦（上游 1.11.x 与本 fork 0.0.x 各走各的）。
#   若把版本号写进 cmd/server/main.go 的 appVersion（上游文件），上游每次发版都会
#   改同一行 → 本工作流的自动合并每次都会冲突、需要人工介入。所以版本号放
#   FORK_VERSION（本 fork 专属文件），上游代码保持零改动，合并永不冲突。
#
# 为什么要同一个 run 内调用（不能靠 push 事件接力）：
#   用 GITHUB_TOKEN 推送的提交不会触发新的 workflow（GitHub 递归触发防护），
#   推完等 push 事件会永远等不到。故这里用 workflow_call 直接串联。
#
# 上游发新版 → 本仓库自动发 0.0.(N+1)，附带 KernelSU arm64-v8a 模块。
on:
  schedule:
    # 每小时检查一次（上游发版频繁，6 小时一次太慢；GitHub 定时任务高峰期可能延迟
    # 5~30 分钟，属正常）。无新提交时整个 run 约 10 秒即结束，开销可忽略。
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "即使上游无新提交也强制重新发布当前版本"
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      tag: ${{ steps.sync.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并上游更新并递增版本号
        id: sync
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/linguo2625469/workbuddy2api-panel.git
          git fetch --no-tags upstream main

          OUR_HEAD=$(git rev-parse HEAD)
          UP_HEAD=$(git rev-parse upstream/main)
          CUR="$(tr -d ' \r\n' < FORK_VERSION)"

          # 上游无新提交：默认跳过（force 时仍走一遍发布，便于手动重发）
          if git merge-base --is-ancestor "$UP_HEAD" "$OUR_HEAD"; then
            if [ "${{ inputs.force }}" != "true" ]; then
              echo "上游无新提交，跳过（当前 fork 版本 ${CUR}）"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "force=true：用当前版本 v${CUR} 重发"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${CUR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 记下合并前的上游面板版本，写进提交信息（发布时能对上「基于上游哪版」）
          UP_VER=$(git show "$UP_HEAD:cmd/server/main.go" | grep -oP 'appVersion = "\K[^"]+')
          echo "上游面板版本: ${UP_VER}"

          # 合并上游：本 fork 不改上游任何文件，正常 fast-forward 或干净合并
          if ! git merge --no-edit "$UP_HEAD"; then
            echo "::error::上游合并冲突，需人工处理"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # 递增本 fork 版本号：patch +1（0.0.1 → 0.0.2）
          A="${CUR%%.*}"; R="${CUR#*.}"; B="${R%%.*}"; C="${R##*.}"
          NEW="${A}.${B}.$((C + 1))"
          printf '%s\n' "$NEW" > FORK_VERSION
          grep -qx "$NEW" FORK_VERSION   # 写入必须生效
          echo "本 fork 版本: ${CUR} → ${NEW}"

          git add -A
          git commit -m "chore: 同步上游面板（上游 ${UP_VER}）并升版本号 ${NEW}"

          # GITHUB_TOKEN 推送（不会触发 push 事件，本 run 内自行串联发布）
          git push origin HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"

      - name: 打 tag 并推送
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -eu
          TAG="${{ steps.sync.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "tag ${TAG} 已存在（force 重发场景），删除后重建"
            git push origin ":refs/tags/${TAG}" || true
          fi
          git tag -f "$TAG"
          git push origin "refs/tags/${TAG}"

  # 复用 go-binaries 的构建+发布链路（workflow_call），以 sync job 推好的 tag 为 ref
  release:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    # 子工作流需要 contents: write 才能建 Release / 推 ksu-update 分支
    permissions:
      contents: write
    uses: ./.github/workflows/go-binaries.yml
    with:
      tag: ${{ needs.sync.outputs.tag }}
